name: Bootstrap Pinned Gate

on:
  workflow_dispatch:
    inputs:
      DATASET_URL:
        description: 'Direct truth/vector held-out archive URL on an allowlisted academic or trusted cloud mirror host'
        required: true
        type: string
      SAR_RASTER_URL:
        description: 'Direct Sentinel-1 VV/VH GeoTIFF archive URL on an allowlisted cloud or EO host; must contain one co-registered VV/VH pair for every truth year discovered'
        required: true
        type: string
      REFERENCE_SET_KEY:
        description: 'Authoritative held-out reference set key'
        required: false
        default: 'snowslide-heldout-v1'
        type: string
      SOURCE_VERSION:
        description: 'External dataset version identifier; defaults to current UTC date when omitted'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-pinned-gate
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Seed authoritative Sentinel-1 SAR refs
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATASET_URL: ${{ inputs.DATASET_URL }}
      SAR_RASTER_URL: ${{ inputs.SAR_RASTER_URL }}
      REFERENCE_SET_KEY: ${{ inputs.REFERENCE_SET_KEY }}
      SOURCE_VERSION_INPUT: ${{ inputs.SOURCE_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be configured as GitHub secrets"
            exit 1
          fi

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.txt

      - name: Resolve source version
        id: resolve_source_version
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_VERSION_INPUT}" ]; then
            value="${SOURCE_VERSION_INPUT}"
          else
            value="$(date -u +%F)"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

      - name: Validate truth and SAR URL allowlists
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          truth_allowed_hosts = {
              'envidat.ch',
              'www.envidat.ch',
              'zenodo.org',
              'www.zenodo.org',
              'slf.ch',
              'www.slf.ch',
              'storage.googleapis.com',
              's3.amazonaws.com',
          }
          truth_allowed_suffixes = ('.s3.amazonaws.com',)
          raster_allowed_hosts = {
              'storage.googleapis.com',
              's3.amazonaws.com',
              'dataspace.copernicus.eu',
          }
          raster_allowed_suffixes = ('.s3.amazonaws.com',)

          def validate_url(env_name: str, *, exact_hosts: set[str], host_suffixes: tuple[str, ...] = ()) -> None:
              url = os.environ[env_name]
              parsed = urlparse(url)
              if parsed.scheme != 'https':
                  raise SystemExit(f'{env_name} must use https: {url}')
              hostname = parsed.hostname or ''
              if hostname not in exact_hosts and not any(hostname.endswith(suffix) for suffix in host_suffixes):
                  raise SystemExit(
                      f'{env_name} host must be one of {sorted(exact_hosts)} or end with {host_suffixes}; got {hostname!r}'
                  )
              if parsed.username or parsed.password or parsed.port:
                  raise SystemExit(f'{env_name} must not include credentials or a custom port')
              if not parsed.path or parsed.path.endswith('/'):
                  raise SystemExit(f'{env_name} must point to a direct archive file, not a landing page')
              print(f'validated {env_name}: {hostname}')

          validate_url('DATASET_URL', exact_hosts=truth_allowed_hosts, host_suffixes=truth_allowed_suffixes)
          validate_url('SAR_RASTER_URL', exact_hosts=raster_allowed_hosts, host_suffixes=raster_allowed_suffixes)
          PY

      - name: Download truth/vector archive
        run: |
          set -euo pipefail
          wget "${DATASET_URL}" -O truth_archive.zip

      - name: Download Sentinel-1 VV/VH raster archive
        run: |
          set -euo pipefail
          wget "${SAR_RASTER_URL}" -O sar_rasters.zip

      - name: Verify ZIP payloads
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          truth_archive = Path('truth_archive.zip')
          sar_archive = Path('sar_rasters.zip')
          if not truth_archive.exists():
              raise SystemExit('truth_archive.zip was not downloaded')
          if not sar_archive.exists():
              raise SystemExit('sar_rasters.zip was not downloaded')
          if not zipfile.is_zipfile(truth_archive):
              raise SystemExit('downloaded truth payload is not a valid ZIP archive; use a direct dataset file URL')
          if not zipfile.is_zipfile(sar_archive):
              raise SystemExit('downloaded SAR raster payload is not a valid ZIP archive; use a direct dataset file URL')
          with zipfile.ZipFile(sar_archive) as archive:
              tif_members = [
                  name for name in archive.namelist()
                  if Path(name).suffix.lower() in {'.tif', '.tiff'}
              ]
          if not tif_members:
              raise SystemExit('SAR raster archive does not contain any .tif/.tiff members')
          print('zip payloads ok')
          PY

      - name: Assemble truth and Sentinel-1 SAR inputs
        run: |
          set -euo pipefail
          python -m backend.scripts.assemble_seed_archive \
            --truth-zip truth_archive.zip \
            --sar-zip sar_rasters.zip \
            --output-dir assembled_seed_dir | tee assemble_result.json

      - name: Preflight assembled Sentinel-1 SAR dataset
        run: |
          set -euo pipefail
          python -m backend.scripts.seed_snowslide_truth \
            --source-dir assembled_seed_dir \
            --set-key "${REFERENCE_SET_KEY}" \
            --source-version "${{ steps.resolve_source_version.outputs.value }}" \
            --validate-only | tee validate_result.json

      - name: Seed authoritative assembled Sentinel-1 SAR refs
        run: |
          set -euo pipefail
          python -m backend.scripts.seed_snowslide_truth \
            --source-dir assembled_seed_dir \
            --set-key "${REFERENCE_SET_KEY}" \
            --source-version "${{ steps.resolve_source_version.outputs.value }}" | tee seed_result.json

      - name: Materialize baselines and activate reference set
        run: |
          set -euo pipefail
          python -m backend.scripts.materialize_release_baseline_masks \
            --reference-set-key "${REFERENCE_SET_KEY}" | tee baseline_result.json

      - name: Verify bootstrap results
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          assembled = json.loads(Path('assemble_result.json').read_text(encoding='utf-8'))
          validate = json.loads(Path('validate_result.json').read_text(encoding='utf-8'))
          seed = json.loads(Path('seed_result.json').read_text(encoding='utf-8'))
          baseline = json.loads(Path('baseline_result.json').read_text(encoding='utf-8'))

          if assembled.get('status') != 'ok':
              raise SystemExit(f'assemble_seed_archive failed: {assembled}')
          if validate.get('status') != 'ok':
              raise SystemExit(f'assembled Sentinel-1 SAR dataset preflight failed: {validate}')
          if seed.get('status') != 'ok':
              raise SystemExit(f'seed_snowslide_truth failed: {seed}')
          if baseline.get('status') != 'ok':
              raise SystemExit(f'materialize_release_baseline_masks failed: {baseline}')
          if baseline.get('reference_set_status') != 'active':
              raise SystemExit(f'authoritative reference set did not reach active status: {baseline}')

          print(
              json.dumps(
                  {
                      'reference_set_key': baseline.get('reference_set_key'),
                      'assembled_scene_count': assembled.get('scene_count'),
                      'scene_count': baseline.get('scene_count'),
                      'reference_set_status': baseline.get('reference_set_status'),
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Cleanup bootstrap artifacts
        if: always()
        run: |
          set -euo pipefail
          rm -rf truth_archive.zip sar_rasters.zip assembled_seed_dir assemble_result.json validate_result.json seed_result.json baseline_result.json
