name: Avalanche Async ML Pipeline

on:
  schedule:
    - cron: '0 4 * * 1'
    - cron: '0 2 * * *'
    - cron: '0 3 * * 1'  # weekly SAR extraction (only runs when GEE secrets present)
    - cron: '0 5 * * *'  # daily Gemini-assisted news ingest (only runs when NEWSDATA+GEMINI secrets present)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'train'
        type: choice
        options:
          - train
          - infer
          - backfill
          - gee
          - news
          - sar_backfill
          - sar_segment
          - train_mtslstm
          - infer_mtslstm
          - evaluate_release
      backfill_start_date:
        description: 'Historical SAR backfill start (YYYY-MM-DD). Used only for mode=sar_backfill.'
        required: false
        default: '2023-11-01'
      backfill_end_date:
        description: 'Historical SAR backfill end (YYYY-MM-DD). Used only for mode=sar_backfill.'
        required: false
        default: '2024-04-30'
      samples_per_region:
        description: 'Training samples per region'
        required: false
        default: '500'
      forecast_hours:
        description: 'Forecast horizon hours'
        required: false
        default: '72'
      dataset_snapshot_id:
        description: 'Dataset snapshot requested by the Modal worker. Use latest for automatic resolution.'
        required: false
        default: 'latest'
      mts_lstm_epochs:
        description: 'Requested MTS-LSTM training epochs for the Modal worker.'
        required: false
        default: '50'
      sar_release_gate_passed:
        description: 'Whether SAR release evaluation already passed and promoted SAR labels may contribute to cutover gating.'
        required: false
        default: 'false'
      pss_floor:
        description: 'PSS artifact gate floor (train + backfill). Defaults to 0.45; override to 0.0 for cold-start warmup.'
        required: false
        default: '0.45'
      run_physics_runout:
        description: 'Enable WhiteboxTools/rasterio Alpha-Beta runout physics (requires DEMs in backend/data/dem)'
        required: false
        default: 'false'
      evaluation_manifest_json:
        description: 'Optional ad hoc JSON manifest for manual evaluate_release experiments. The official gate uses reference_set_key instead.'
        required: false
        default: ''
      reference_set_key:
        description: 'Authoritative SnowSlide held-out reference-set key for the official evaluate_release gate.'
        required: false
        default: ''
      prediction_model_version:
        description: 'Held-out SAR prediction model version used to resolve prediction_mask refs.'
        required: false
        default: 'sar_unet_resnet34_shadow_v1'

permissions:
  contents: read

concurrency:
  group: avalanche-ml-pipeline
  cancel-in-progress: false

jobs:
  train:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'train') || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with LFS DEMs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Train model
        env:
          ARTIFACT_ROOT: backend/artifacts
          SAMPLES_PER_REGION: ${{ github.event.inputs.samples_per_region || '500' }}
          ML_SEED: '42'
          PSS_FLOOR: ${{ github.event.inputs.pss_floor || '0.45' }}
          # P0.2: Lowered from 30 → 10 so nightly training actually runs against
          # the current corpus of ~20 field reports while the verified-event
          # promotion pipeline (P1.3) populates higher-quality rows.
          MIN_EVENTS_FOR_TRAINING: '10'
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m backend.train_model

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avalanche-train-artifacts
          path: backend/artifacts

  infer:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'infer') || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with LFS DEMs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Download training artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: avalanche-train-artifacts
          path: backend/artifacts
        continue-on-error: true

      - name: Run daily inference
        env:
          ARTIFACT_ROOT: backend/artifacts
          FORECAST_HOURS: ${{ github.event.inputs.forecast_hours || '72' }}
          GRID_SIZE: '20'
          RUN_PHYSICS_RUNOUT: ${{ github.event.inputs.run_physics_runout || 'false' }}
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m backend.daily_inference

      # P0.2: Surface the inference manifest as a step output so failures show
      # the last-known-good state inline in the GitHub UI.
      - name: Emit inference summary
        if: always()
        run: |
          if [ -f backend/artifacts/*/inference_manifest.json ]; then
            cat backend/artifacts/*/inference_manifest.json | tail -n 200
          else
            echo '::warning::inference_manifest.json not written; daily inference probably failed before regions_written stage.'
          fi

      - name: Upload inference artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avalanche-inference-artifacts
          path: backend/artifacts

  backfill:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backfill training
        env:
          ARTIFACT_ROOT: backend/artifacts
          SAMPLES_PER_REGION: ${{ github.event.inputs.samples_per_region || '500' }}
          ML_SEED: '42'
          PSS_FLOOR: ${{ github.event.inputs.pss_floor || '0.45' }}
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m backend.train_model

      - name: Run backfill inference
        env:
          ARTIFACT_ROOT: backend/artifacts
          FORECAST_HOURS: ${{ github.event.inputs.forecast_hours || '72' }}
          GRID_SIZE: '20'
          RUN_PHYSICS_RUNOUT: ${{ github.event.inputs.run_physics_runout || 'false' }}
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m backend.daily_inference

      - name: Upload backfill artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avalanche-backfill-artifacts
          path: backend/artifacts

  gee:
    # Story 21 SAR Shadow Fix + Edit 4: Sentinel-1 wet-snow extraction with
    # mandatory SRTM layover/shadow mask BEFORE VV/VH thresholding.
    # Runs only when GEE service-account secrets are configured; otherwise
    # the Python script exits 0 cleanly so the job never fails.
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'gee') || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run GEE Sentinel-1 extractor
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_LOOKBACK_DAYS: '7'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m backend.gee_extractor

  news:
    # Daily Gemini-assisted news ingest. Queries newsdata.io for avalanche
    # articles, extracts structured events via Gemini 2.0 Flash, and POSTs
    # qualifying events through the ingest-event edge function (so they go
    # through the standard topo-snap + deposit-zone pipeline). Skips cleanly
    # (exit 0) when NEWSDATA_API_KEY or GEMINI_API_KEY secrets are absent.
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'news') || (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install requests

      - name: Run Gemini news ingest
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWS_LOOKBACK_HOURS: '48'
          NEWS_MAX_ARTICLES: '10'
          NEWS_MIN_CONFIDENCE: '0.6'
        run: python -m backend.news_ingest

  sar_backfill:
    # One-shot historical Sentinel-1 SAR backfill with LOCAL topo extraction.
    # Dispatch-only (no schedule). Detects SAR centroids via GEE, then opens
    # local Git LFS DEMs with rasterio to compute elevation/slope/aspect
    # (Horn 3x3) and applies the 25-65 deg physics gate before batch insert.
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sar_backfill')
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout repository (with LFS DEMs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install system deps for rasterio
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt earthengine-api

      - name: Verify DEM bundle
        run: |
          ls -la backend/data/dem/
          python -c "import rasterio; ds=rasterio.open('backend/data/dem/colorado_rockies.tif'); print('DEM shape', ds.shape, 'bounds', ds.bounds)"

      - name: Run historical SAR backfill (local topo)
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL_START_DATE: ${{ github.event.inputs.backfill_start_date }}
          BACKFILL_END_DATE: ${{ github.event.inputs.backfill_end_date }}
          BACKFILL_CHUNK_DAYS: '7'
          PHYSICS_SLOPE_MIN_DEG: '25'
          PHYSICS_SLOPE_MAX_DEG: '65'
        run: python -m backend.historical_sar_backfill

  sar_segment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sar_segment'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Dispatch SAR segmentation worker
        env:
          MODAL_WORKER_URL: ${{ secrets.MODAL_WORKER_URL }}
          MODAL_WORKER_TOKEN: ${{ secrets.MODAL_WORKER_TOKEN }}
        run: |
          if [ -z "${MODAL_WORKER_URL}" ]; then
            echo "::error::MODAL_WORKER_URL secret is required for sar_segment"
            exit 1
          fi
          auth_args=()
          if [ -n "${MODAL_WORKER_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${MODAL_WORKER_TOKEN}")
          fi
          cat > payload.json <<'JSON'
          {
            "hazard_type": "avalanche",
            "requested_by": "github_actions",
            "request_type": "sar_segment",
            "shadow_mode": true,
            "persist_events": true,
            "training_eligible": false,
            "training_eligible_reason": "sar_unet_shadow_mode"
          }
          JSON
          curl -fsSL -X POST "${MODAL_WORKER_URL%/}/sar-segment" \
            -H "Content-Type: application/json" \
            "${auth_args[@]}" \
            --data @payload.json | tee sar-segment-response.json

      - name: Upload SAR segment response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sar-segment-response
          path: sar-segment-response.json

  train_mtslstm:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'train_mtslstm'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Dispatch MTS-LSTM training worker
        env:
          MODAL_WORKER_URL: ${{ secrets.MODAL_WORKER_URL }}
          MODAL_WORKER_TOKEN: ${{ secrets.MODAL_WORKER_TOKEN }}
          SAMPLES_PER_REGION: ${{ github.event.inputs.samples_per_region || '500' }}
          DATASET_SNAPSHOT_ID: ${{ github.event.inputs.dataset_snapshot_id || 'latest' }}
          MTS_LSTM_EPOCHS: ${{ github.event.inputs.mts_lstm_epochs || '50' }}
          SAR_RELEASE_GATE_PASSED: ${{ github.event.inputs.sar_release_gate_passed || 'false' }}
          PSS_FLOOR: ${{ github.event.inputs.pss_floor || '0.45' }}
        run: |
          if [ -z "${MODAL_WORKER_URL}" ]; then
            echo "::error::MODAL_WORKER_URL secret is required for train_mtslstm"
            exit 1
          fi
          auth_args=()
          if [ -n "${MODAL_WORKER_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${MODAL_WORKER_TOKEN}")
          fi
          cat > payload.json <<JSON
          {
            "hazard_type": "avalanche",
            "requested_by": "github_actions",
            "request_type": "train_mtslstm",
            "dataset_snapshot_id": "${DATASET_SNAPSHOT_ID}",
            "epochs": ${MTS_LSTM_EPOCHS},
            "early_stopping": true,
            "minimum_epochs_before_early_stopping": 10,
            "patience_early_stopping": 7,
            "shadow_mode": true,
            "promotion_rule": "strict_pss_gt_rf_and_brier_lte_rf",
            "sar_release_gate_passed": ${SAR_RELEASE_GATE_PASSED},
            "samples_per_region": ${SAMPLES_PER_REGION},
            "pss_floor": ${PSS_FLOOR}
          }
          JSON
          curl -fsSL -X POST "${MODAL_WORKER_URL%/}/train-mtslstm" \
            -H "Content-Type: application/json" \
            "${auth_args[@]}" \
            --data @payload.json | tee train-mtslstm-response.json

      - name: Upload MTS-LSTM train response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: train-mtslstm-response
          path: train-mtslstm-response.json

  infer_mtslstm:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'infer_mtslstm'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Dispatch MTS-LSTM inference worker
        env:
          MODAL_WORKER_URL: ${{ secrets.MODAL_WORKER_URL }}
          MODAL_WORKER_TOKEN: ${{ secrets.MODAL_WORKER_TOKEN }}
          FORECAST_HOURS: ${{ github.event.inputs.forecast_hours || '72' }}
        run: |
          if [ -z "${MODAL_WORKER_URL}" ]; then
            echo "::error::MODAL_WORKER_URL secret is required for infer_mtslstm"
            exit 1
          fi
          auth_args=()
          if [ -n "${MODAL_WORKER_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${MODAL_WORKER_TOKEN}")
          fi
          cat > payload.json <<JSON
          {
            "hazard_type": "avalanche",
            "requested_by": "github_actions",
            "request_type": "infer_mtslstm",
            "dataset_snapshot_id": "${{ github.event.inputs.dataset_snapshot_id || 'latest' }}",
            "forecast_hours": ${FORECAST_HOURS}
          }
          JSON
          curl -fsSL -X POST "${MODAL_WORKER_URL%/}/infer-mtslstm" \
            -H "Content-Type: application/json" \
            "${auth_args[@]}" \
            --data @payload.json | tee infer-mtslstm-response.json

      - name: Upload MTS-LSTM infer response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infer-mtslstm-response
          path: infer-mtslstm-response.json

  evaluate_release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'evaluate_release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies required for manifest building
        run: python -m pip install --upgrade pip && pip install numpy requests

      - name: Dispatch release-evaluation worker
        env:
          MODAL_WORKER_URL: ${{ secrets.MODAL_WORKER_URL }}
          MODAL_WORKER_TOKEN: ${{ secrets.MODAL_WORKER_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REFERENCE_SET_KEY: ${{ github.event.inputs.reference_set_key }}
          PREDICTION_MODEL_VERSION: ${{ github.event.inputs.prediction_model_version || 'sar_unet_resnet34_shadow_v1' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -z "${MODAL_WORKER_URL}" ]; then
            echo "::error::MODAL_WORKER_URL secret is required for evaluate_release"
            exit 1
          fi
          if [ -z "${REFERENCE_SET_KEY}" ]; then
            echo "::error::reference_set_key is required for the official evaluate_release gate."
            exit 1
          fi
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required to build the authoritative held-out manifest."
            exit 1
          fi
          auth_args=()
          if [ -n "${MODAL_WORKER_TOKEN}" ]; then
            auth_args=(-H "Authorization: Bearer ${MODAL_WORKER_TOKEN}")
          fi
          python -m backend.sar_release_manifest \
            --reference-set-key "${REFERENCE_SET_KEY}" \
            --prediction-model-version "${PREDICTION_MODEL_VERSION}" \
            --skip-validate-refs \
            --output manifest.json
          python - <<'PY'
          import json

          with open('manifest.json', 'r', encoding='utf-8') as handle:
            manifest = json.load(handle)
          payload = dict(manifest)
          payload.update({
            "hazard_type": "avalanche",
            "requested_by": "github_actions",
            "request_type": "evaluate_release",
            "release_target": "sar_unet",
          })
          with open('payload.json', 'w', encoding='utf-8') as handle:
            json.dump(payload, handle, indent=2, sort_keys=True)
          PY
          curl -fsSL -X POST "${MODAL_WORKER_URL%/}/evaluate-release" \
            -H "Content-Type: application/json" \
            "${auth_args[@]}" \
            --data @payload.json | tee evaluate-release-response.json

      - name: Fail on invalid evaluation response
        run: |
          python - <<'PY'
          import json

          with open('evaluate-release-response.json', 'r', encoding='utf-8') as handle:
            response = json.load(handle)

          status = str(response.get('status') or '')
          if status != 'ok':
            raise SystemExit(
              f"evaluate_release returned status={status or 'missing'}: "
              f"{response.get('reason') or response.get('error') or 'no reason provided'}"
            )

          print(
            json.dumps(
              {
                'status': status,
                'beats_baseline': bool(response.get('beats_baseline')),
                'baseline_f1_floor_used': response.get('baseline_f1_floor_used'),
                'f1': response.get('f1'),
                'iou': response.get('iou'),
              },
              indent=2,
              sort_keys=True,
            )
          )
          PY

      - name: Upload release-evaluation response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluate-release-response
          path: evaluate-release-response.json
