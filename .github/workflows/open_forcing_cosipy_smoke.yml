name: Open Forcing COSIPY Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-forcing-cosipy-smoke
  cancel-in-progress: true

jobs:
  real-cosipy-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install minimal COSIPY runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps cosipymodel==2.0.0
          python -m pip install --only-binary=:all: -r backend/requirements-cosipy-smoke.txt

      - name: Run real coupled COSIPY schema smoke
        env:
          OPEN_FORCING_REAL_COSIPY: '1'
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest backend.tests.test_open_forcing_cosipy_real -q | tee real_cosipy_smoke.log

      - name: Upload smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-forcing-cosipy-smoke
          path: real_cosipy_smoke.log
