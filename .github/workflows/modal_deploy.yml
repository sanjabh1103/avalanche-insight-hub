name: Deploy Modal Worker

# Triggers automatically when any backend worker file changes on main.
# Also supports manual dispatch for forced redeployment.
on:
  # push trigger DISABLED — prevents Actions minute consumption on every push.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'backend/modal_worker_app.py'
  #     - 'backend/sar_unet_worker.py'
  #     - 'backend/sar_unet_training.py'
  #     - 'backend/train_sar_model.py'
  #     - 'backend/lstm_model.py'
  #     - 'backend/train_model.py'
  #     - 'backend/daily_inference.py'
  #     - 'backend/common/sar_model_family.py'
  #     - 'backend/common/sar_training_dataset.py'
  #     - 'backend/common/storage_io.py'
  #     - 'backend/common/label_governance.py'
  #     - 'backend/common/sequence_features.py'
  #     - 'backend/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Modal CLI and backend deploy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/locks/core-py312.txt
          pip install --require-hashes -r backend/locks/ci-py312.txt

      - name: Deploy Modal worker app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "${MODAL_TOKEN_ID}" ] || [ -z "${MODAL_TOKEN_SECRET}" ]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets are required"
            exit 1
          fi
          modal deploy backend/modal_worker_app.py

      - name: Seed DEM volume
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal run backend/modal_worker_app.py --source-root backend/data/dem

      - name: Print canonical worker URL reminder
        run: |
          echo "::notice::Worker deployed as a single ASGI app."
          echo "::notice::Set MODAL_WORKER_URL to the base URL printed by Modal for the deployed ASGI worker app."
          echo "::notice::Expected routes: /health, /sar-segment, /train-sar-unet, /train-mtslstm, /infer-mtslstm, /evaluate-release"
