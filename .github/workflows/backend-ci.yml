name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/functions/**'
      - '.github/workflows/**'
      - 'docs/MODAL_WORKER.md'
      - 'CODEOWNERS'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'supabase/functions/**'
      - '.github/workflows/**'
      - 'docs/MODAL_WORKER.md'
      - 'CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "fastapi[standard]>=0.115.0" "modal>=0.73.82" "PyYAML>=6.0.2" "pytest>=8.0.0"
          pip uninstall -y coverage || true

      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print('workflow yaml ok')
          PY

      - name: Modal app import smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
          MODAL_WORKER_TOKEN: ci-smoke-token
        run: |
          python - <<'PY'
          from backend.modal_worker_app import create_fastapi_app

          app = create_fastapi_app()
          routes = {route.path for route in app.routes}
          expected = {'/health', '/sar-segment', '/train-sar-unet', '/train-mtslstm', '/infer-mtslstm', '/evaluate-release'}
          missing = expected - routes
          if missing:
              raise SystemExit(f'missing modal worker routes: {sorted(missing)}')
          print('modal app routes ok')
          PY

      - name: Run backend unit and gate-lock tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          NUMBA_DISABLE_COVERAGE: '1'
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
