name: Frontend Trust Checks

on:
  workflow_dispatch: {}

concurrency:
  # Keep the newest pull-request verification run and preserve all main/manual
  # runs for auditability and release evidence.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run eslint checks
        run: npm run lint

      - name: Run type checking (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run strict type checking on lib (tsc)
        run: npx tsc -p tsconfig.lib.json --noEmit

      - name: Run full vitest suite
        # The jsdom suite is intentionally serialized. On constrained runners,
        # Vitest's fork pool makes auth/map-heavy tests time out; one worker is
        # deterministic and avoids resource contention for this repository's current suite.
        run: npm run test -- --maxWorkers=1 --fileParallelism=false

      - name: Run production build
        run: npm run build
