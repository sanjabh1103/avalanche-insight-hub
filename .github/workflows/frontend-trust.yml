name: Frontend Trust Checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/frontend-trust.yml'
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/frontend-trust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run eslint checks
        run: npm run lint

      - name: Run type checking (tsc)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run strict type checking on lib (tsc)
        run: npx tsc -p tsconfig.lib.json --noEmit

      - name: Run full vitest suite
        run: npm run test

      - name: Run production build
        run: npm run build
