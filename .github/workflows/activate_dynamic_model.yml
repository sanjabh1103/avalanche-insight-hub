name: Activate Dynamic Model

on:
  workflow_dispatch:
    inputs:
      execute_activation:
        description: 'Actually activate the current candidate scorer'
        required: false
        default: false
        type: boolean
      required_candidate_version:
        description: 'Optional candidate version pin for safe activation'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Activate dynamic model candidate
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ "${{ github.event.inputs.execute_activation }}" = "true" ]; then
            extra_args+=(--execute-activation)
          fi
          if [ -n "${{ github.event.inputs.required_candidate_version }}" ]; then
            extra_args+=(--required-candidate-version "${{ github.event.inputs.required_candidate_version }}")
          fi
          python -m backend.scripts.activate_dynamic_model_candidate "${extra_args[@]}" | tee dynamic_model_activation.json

      - name: Enforce activation result
        if: ${{ github.event.inputs.execute_activation == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('dynamic_model_activation.json').read_text(encoding='utf-8'))
          if payload.get('already_active'):
              print('candidate already active')
              raise SystemExit(0)
          if not payload.get('activation_applied'):
              raise SystemExit(f"activation was not applied: blockers={payload.get('blockers')}")
          print('candidate activation applied')
          PY

      - name: Upload activation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dynamic-model-activation
          path: dynamic_model_activation.json
