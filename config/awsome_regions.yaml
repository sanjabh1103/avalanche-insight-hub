# AWSOME region configuration for Avalanche Insight Hub
# Maps our 8 forecast regions to AWSOME/SNOWPACK simulation parameters.
#
# Each region defines:
#   - center lat/lng for the AWS station
#   - elevation range (min/max) for snow line tracking
#   - slope/aspect for SNOWPACK terrain parameters
#   - season_start: when to begin snowpack simulation (Nov 1 by convention)

colorado_rockies:
  center: [39.5, -106.5]
  elevation_min: 2400
  elevation_max: 4300
  slope_angle: 30
  aspect: 270
  season_start: "11-01"
  timezone: "America/Denver"

